[package]
name = "tools"
description = "Build-time tooling: data validation, asset manifest checks, texture conversion to KTX2."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "agtool"
path = "src/main.rs"

[dependencies]
game_core = { workspace = true }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
sha2.workspace = true
zstd.workspace = true
image = { workspace = true, features = ["png", "jpeg", "hdr"] }
intel_tex_2.workspace = true
rayon.workspace = true

[dev-dependencies]
# The same KTX2 parser Bevy's loader uses: validates our writer independently.
ktx2.workspace = true

[lints]
workspace = true
