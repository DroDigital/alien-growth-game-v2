[package]
name = "game_core"
description = "Pure simulation rules, data types and config shared by the game, launcher and tools. No rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["bevy"]
# ECS integration (States, Resources, headless plugins). The launcher builds
# without it so it never compiles Bevy.
bevy = ["dep:bevy"]

[dependencies]
bevy = { workspace = true, optional = true, features = ["std", "bevy_state", "bevy_log", "multi_threaded", "serialize"] }
serde.workspace = true
serde_json.workspace = true
ron.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
directories.workspace = true
thiserror.workspace = true
sha2.workspace = true
noise.workspace = true
rand = { workspace = true, features = ["std"] }
rand_chacha.workspace = true
rayon.workspace = true

[[bin]]
name = "balance-bots"
path = "src/bin/balance_bots.rs"
required-features = ["bevy"]

[lints]
workspace = true
